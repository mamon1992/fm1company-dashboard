const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openPage(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},k,u8(CT));const h=new TextDecoder().decode(pt);localStorage.setItem('dash_pw',pw);document.open();document.write(h);document.close();}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{await openPage(document.getElementById('pw').value)}catch(x){document.getElementById('m').textContent='비밀번호가 다릅니다'}};
(async()=>{const s=localStorage.getItem('dash_pw');if(s){try{await openPage(s)}catch(x){}}})();
</script></body></html>
